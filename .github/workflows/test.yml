name: Проверка сайта и API
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установить зависимости
        run: npm install --no-audit --no-fund
      - name: Проверить синтаксис
        run: npm run check
      - name: Запустить тесты
        run: npm test
